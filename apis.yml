name: Brite
description: Brite is a white-label learning management system (LMS) platform for STEM education, giving
  educators, academies, and learning centers a single operational tool to run computer-science programs
  in game and web development. It bundles a ready-made curriculum, classroom and roster management,
  student progress reporting, and teacher accounts, replacing spreadsheets and disparate software with
  one branded platform. Brite is offered on free, per-student Professional, and custom school/district
  tiers. Surfaced as a Techstars portfolio company and added to the API Evangelist network; no public
  developer API, OpenAPI, or documentation surface was found during enrichment.
